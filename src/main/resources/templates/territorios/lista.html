<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Territorios')}"></head>
<body>
<header th:replace="~{fragments :: cabecera}"></header>

<main class="contenedor">
    <h1 class="titulo">Territorios</h1>

    <div class="tabla-envoltorio">
        <table class="tabla">
            <thead>
                <tr>
                    <th>Territorio</th>
                    <th>Descripción</th>
                    <th>Tripulaciones que lo dominan</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="te : ${territorios}">
                    <td><a th:href="@{/territorios/{id}(id=${te.id})}" th:text="${te.nombre}">Territorio</a></td>
                    <td th:text="${te.descripcion}">Descripción</td>
                    <td th:text="${te.tripulaciones.size()}">0</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
