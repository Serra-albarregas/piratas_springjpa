<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Tripulaciones')}"></head>
<body>
<header th:replace="~{fragments :: cabecera}"></header>

<main class="contenedor">
    <h1 class="titulo">Tripulaciones</h1>

    <div class="tabla-envoltorio">
        <table class="tabla">
            <thead>
                <tr>
                    <th>Tripulación</th>
                    <th>Descripción</th>
                    <th>Piratas</th>
                    <th>Territorios</th>
                </tr>
            </thead>
            <tbody>
                <!-- t es un DTO (record TripulacionResumen): los datos y los recuentos llegan calculados
                     en una sola consulta. Los componentes de un record se leen con paréntesis: t.nombre() -->
                <tr th:each="t : ${tripulaciones}">
                    <td><a th:href="@{/tripulaciones/{id}(id=${t.id()})}" th:text="${t.nombre()}">Tripulación</a></td>
                    <td th:text="${t.descripcion()}">Descripción</td>
                    <td th:text="${t.piratas()}">0</td>
                    <td th:text="${t.territorios()}">0</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
