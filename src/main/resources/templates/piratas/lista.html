<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Carteles')}"></head>
<body>
<header th:replace="~{fragments :: cabecera}"></header>

<main class="contenedor">
    <h1 class="titulo">Se busca</h1>

    <p class="aviso" th:if="${mensaje}" th:text="${mensaje}"></p>

    <form class="filtros" method="get" th:action="@{/piratas}">
        <label>Nombre
            <input type="text" name="nombre" th:value="${nombre}" placeholder="Luffy…">
        </label>
        <label>Tripulación
            <select name="tripulacion">
                <option value="">Todas</option>
                <option th:each="t : ${tripulaciones}" th:value="${t}" th:text="${t}"
                        th:selected="${t == tripulacion}"></option>
            </select>
        </label>
        <label>Recompensa mínima (฿)
            <input type="number" name="recompensaMin" min="0" step="1000" th:value="${recompensaMin}">
        </label>
        <label>Ordenar por
            <select name="orden">
                <option value="recompensa" th:selected="${orden == 'recompensa'}">Recompensa</option>
                <option value="nombre" th:selected="${orden == 'nombre'}">Nombre</option>
                <option value="tripulacion" th:selected="${orden == 'tripulacion'}">Tripulación</option>
            </select>
        </label>
        <label>Sentido
            <select name="dir">
                <option value="desc" th:selected="${dir == 'desc'}">Descendente</option>
                <option value="asc" th:selected="${dir == 'asc'}">Ascendente</option>
            </select>
        </label>
        <label>Por página
            <select name="size">
                <option th:each="t : ${tamanos}" th:value="${t}" th:text="${t}" th:selected="${t == size}"></option>
            </select>
        </label>
        <button class="boton" type="submit">Buscar</button>
        <a class="boton boton-sec" th:href="@{/piratas}">Limpiar</a>
    </form>

    <p class="contador"
       th:text="|${pagina.totalElements} pirata(s) · página ${pagina.number + 1} de ${pagina.totalPages == 0 ? 1 : pagina.totalPages}|"></p>

    <section class="carteles">
        <a class="cartel" th:each="p : ${piratas}" th:href="@{/piratas/{id}(id=${p.id})}">
            <span class="cartel-wanted">WANTED</span>
            <div class="cartel-foto"><span th:text="${#strings.substring(p.nombre, 0, 1)}">M</span></div>
            <h2 th:text="${p.nombre}">Nombre</h2>
            <p class="cartel-tripulacion" th:text="${p.tripulacion}">Tripulación</p>
            <p class="cartel-recompensa" th:text="${#numbers.formatInteger(p.recompensa, 1, 'POINT')} + ' ฿'">0 ฿</p>
        </a>
    </section>

    <p class="vacio" th:if="${piratas.isEmpty()}">Ningún pirata coincide con esa búsqueda. ¡El mar es muy grande!</p>

    <nav class="paginacion" th:if="${pagina.totalPages > 1}" aria-label="Paginación">
        <a th:if="${pagina.hasPrevious()}" th:href="@{${urlBase + 0}}" title="Primera">«</a>
        <span th:unless="${pagina.hasPrevious()}" class="desactivado">«</span>

        <a th:if="${pagina.hasPrevious()}" th:href="@{${urlBase + (pagina.number - 1)}}">‹ Anterior</a>
        <span th:unless="${pagina.hasPrevious()}" class="desactivado">‹ Anterior</span>

        <th:block th:each="i : ${#numbers.sequence(inicioVentana, finVentana)}">
            <span th:if="${i == pagina.number}" class="actual" th:text="${i + 1}">1</span>
            <a th:unless="${i == pagina.number}" th:href="@{${urlBase + i}}" th:text="${i + 1}">2</a>
        </th:block>

        <a th:if="${pagina.hasNext()}" th:href="@{${urlBase + (pagina.number + 1)}}">Siguiente ›</a>
        <span th:unless="${pagina.hasNext()}" class="desactivado">Siguiente ›</span>

        <a th:if="${pagina.hasNext()}" th:href="@{${urlBase + (pagina.totalPages - 1)}}" title="Última">»</a>
        <span th:unless="${pagina.hasNext()}" class="desactivado">»</span>
    </nav>
</main>
</body>
</html>
