<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nuevo pirata')}"></head>
<body>
<header th:replace="~{fragments :: cabecera}"></header>

<main class="contenedor">
    <h1 class="titulo">Alistar un pirata</h1>

    <!-- novalidate: así se ve la validación del servidor (Bean Validation) y no la del navegador -->
    <form class="formulario" method="post" th:action="@{/piratas}" th:object="${pirata}" novalidate>

        <div class="campo" th:classappend="${#fields.hasErrors('nombre')} ? 'con-error'">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}">
            <small class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
        </div>

        <!-- El formulario trabaja con un DTO (PirataForm): el <select> guarda el ID de la tripulación -->
        <div class="campo" th:classappend="${#fields.hasErrors('tripulacionId')} ? 'con-error'">
            <label for="tripulacionId">Tripulación</label>
            <select id="tripulacionId" th:field="*{tripulacionId}">
                <option value="">— Elige una tripulación —</option>
                <option th:each="t : ${tripulaciones}" th:value="${t.id}" th:text="${t.nombre}"></option>
            </select>
            <small class="error" th:if="${#fields.hasErrors('tripulacionId')}" th:errors="*{tripulacionId}"></small>
        </div>

        <!-- Solo se ofrecen las frutas sin dueño: la relación es uno a uno -->
        <div class="campo" th:classappend="${#fields.hasErrors('frutaId')} ? 'con-error'">
            <label for="frutaId">Fruta del Diablo (opcional)</label>
            <select id="frutaId" th:field="*{frutaId}">
                <option value="">Ninguna</option>
                <option th:each="f : ${frutas}" th:value="${f.id}"
                        th:text="|${f.nombre} (${f.tipo.etiqueta})|"></option>
            </select>
            <small class="error" th:if="${#fields.hasErrors('frutaId')}" th:errors="*{frutaId}"></small>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('recompensa')} ? 'con-error'">
            <label for="recompensa">Recompensa (฿)</label>
            <input id="recompensa" type="number" th:field="*{recompensa}">
            <small class="error" th:if="${#fields.hasErrors('recompensa')}" th:errors="*{recompensa}"></small>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('descripcion')} ? 'con-error'">
            <label for="descripcion">Descripción (opcional)</label>
            <textarea id="descripcion" rows="4" th:field="*{descripcion}"></textarea>
            <small class="error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>
        </div>

        <div class="acciones">
            <button class="boton" type="submit">Guardar pirata</button>
            <a class="boton boton-sec" th:href="@{/piratas}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
